name: Daily Unstable Post Offices Report

on:
  schedule:
    # Chạy vào lúc 08:00 AM giờ Việt Nam (ICT) mỗi ngày -> 01:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # Cho phép kích hoạt chạy thủ công trên giao diện GitHub Web

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread oauth2client requests pytz playwright pillow
          playwright install chromium

      - name: Write Google Sheet Service Account Credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Run Report and Send Messages
        env:
          GTALK_OA_TOKEN: ${{ secrets.GTALK_OA_TOKEN }}
          GTALK_CHANNEL_ID: ${{ secrets.GTALK_CHANNEL_ID }}
        run: |
          python report_BC_BatOn_html.py
